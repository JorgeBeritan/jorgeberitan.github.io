baseURL: https://jorgeberitan.github.io/
locale: en-us
title: Jorge Beritan
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Jorge Beritan
  description: "Offensive security research. Systems programming. Zig."
  author: Jorge Beritan

  defaultTheme: dark
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true

  label:
    text: "Jorge Beritan"

  homeInfoParams:
    Title: "Black Hat Zig"
    Content: >
      Offensive security research and tooling in Zig.
      Exploring low-level primitives, syscall interfaces, and compile-time capabilities
      for building security tools from scratch.

  socialIcons:
    - name: github
      url: "https://github.com/JorgeBeritan"

  cover:
    linkFullImages: true

  editPost:
    URL: "https://github.com/JorgeBeritan/jorgeberitan.github.io/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: dracula

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: research
      name: Research
      url: /research/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
